      annotations:
        kompose.cmd: kompose convert -f legacy-compose/docker-compose.yml -o k8s-kompose-raw/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: worker
    spec:
      containers:
        - image: worker
          name: worker
      restartPolicy: Always
