apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f legacy-compose/docker-compose.yml -o k8s-kompose/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: result
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f legacy-compose/docker-compose.yml -o k8s-kompose/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: result
    spec:
      containers:
        - image: dockersamples/examplevotingapp_result
          name: result
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {memory: 256Mi}
      restartPolicy: Always
