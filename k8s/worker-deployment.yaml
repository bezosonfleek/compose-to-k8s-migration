apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f legacy-compose/docker-compose.yml -o k8s-kompose/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: worker
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: worker
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f legacy-compose/docker-compose.yml -o k8s-kompose/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: worker
    spec:
      containers:
        - image: dockersamples/examplevotingapp_worker
          name: worker
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {memory: 256Mi}
